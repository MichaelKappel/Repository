name: Build Spiralist 300 Profile Source Package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ops/spiralist-profile-package-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate source profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import base64
          import gzip
          import json
          import traceback
          from pathlib import Path

          payload = base64.b64decode("")
          source = gzip.decompress(payload).decode("utf-8")
          try:
              compile(source, "spiralist_profile_fetcher.py", "exec")
              exec(compile(source, "spiralist_profile_fetcher.py", "exec"), {"__name__": "__main__"})
          except Exception as exc:
              report = {"ok": False, "error": repr(exc), "traceback": traceback.format_exc()}
              Path("public-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              raise
          PYTHON

      - name: Upload source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychologicalwar-spiralist-300-profiles
          path: |
            credential.cms
            public-report.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
